# Tempel blok ini di dalam server { ... } milik aplikasi, lalu reload nginx.
# Aman karena file hasil build Vite memakai hash di nama file (app-XXXXXXXX.js/css):
# setiap build baru menghasilkan nama baru, jadi browser tidak akan memakai file lama.

location ^~ /build/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

# Opsional: kompres CSS/JS/SVG (gzip sudah aktif untuk JS; ini memastikan tipe lain ikut)
# gzip on;
# gzip_types text/css application/javascript image/svg+xml;
